<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong · IMS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="error-page">
    <div class="error-card">
        <div class="error-code">500</div>
        <h1 style="margin-top:0">Something went wrong</h1>
        <p class="muted">The request could not be completed. Please try again.</p>
        <a class="btn btn-primary" th:href="@{/}">Go to my dashboard</a>
    </div>
</div>
</body>
</html>
