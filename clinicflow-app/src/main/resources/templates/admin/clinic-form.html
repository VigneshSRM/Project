<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Enroll clinic · IMS</title>
</head>
<body>
<div layout:fragment="content">
    <div th:replace="~{fragments/page-header :: header(
            'Enroll clinic',
            'Create the clinic and invite its first administrator. The clinic is visible to patients only after the invitation is accepted.',
            null, null, 'Step 1 of 2', 'info')}"></div>

    <div class="content-body">
        <form th:action="@{/admin/clinics}" th:object="${clinicForm}" method="post" data-guard>
            <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            </div>
            <section class="card form-section">
                <div class="card-header"><h2 class="card-title">Clinic details</h2></div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="name">Clinic name <span class="required">*</span></label>
                            <input class="form-input" id="name" th:field="*{name}" required maxlength="200">
                            <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">Phone</label>
                            <input class="form-input" id="phone" th:field="*{phone}" maxlength="30">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="addressLine1">Address line 1 <span class="required">*</span></label>
                            <input class="form-input" id="addressLine1" th:field="*{addressLine1}" required maxlength="200">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="addressLine2">Address line 2</label>
                            <input class="form-input" id="addressLine2" th:field="*{addressLine2}" maxlength="200">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="city">City <span class="required">*</span></label>
                            <input class="form-input" id="city" th:field="*{city}" required maxlength="100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="area">Area</label>
                            <input class="form-input" id="area" th:field="*{area}" maxlength="100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="district">District</label>
                            <input class="form-input" id="district" th:field="*{district}" maxlength="100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="state">State <span class="required">*</span></label>
                            <input class="form-input" id="state" th:field="*{state}" required maxlength="100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="postalCode">Postal code <span class="required">*</span></label>
                            <input class="form-input" id="postalCode" th:field="*{postalCode}" required maxlength="20">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">Public email</label>
                            <input class="form-input" id="email" type="email" th:field="*{email}" maxlength="254">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="latitude">Latitude</label>
                            <input class="form-input" id="latitude" type="number" step="0.000001" th:field="*{latitude}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="longitude">Longitude</label>
                            <input class="form-input" id="longitude" type="number" step="0.000001" th:field="*{longitude}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="openingHours">Opening hours</label>
                            <input class="form-input" id="openingHours" th:field="*{openingHours}"
                                   placeholder="Mon–Sat, 09:00–18:00" maxlength="500">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="fees">Consultation fees</label>
                            <input class="form-input" id="fees" th:field="*{fees}" placeholder="From 500" maxlength="200">
                        </div>
                    </div>
                </div>
            </section>

            <section class="card form-section mt-4">
                <div class="card-header"><h2 class="card-title">Clinic administrator</h2></div>
                <div class="card-body">
                    <div class="alert alert-info">
                        We email a single-use invitation. The clinic administrator chooses their own password; no password is created here.
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="adminEmail">Administrator email <span class="required">*</span></label>
                            <input class="form-input" id="adminEmail" type="email" th:field="*{adminEmail}"
                                   required maxlength="254" placeholder="admin@clinic.example">
                            <div class="form-error" th:if="${#fields.hasErrors('adminEmail')}"
                                 th:errors="*{adminEmail}"></div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <a class="btn btn-secondary" th:href="@{/admin/clinics}">Cancel</a>
                <button class="btn btn-primary" type="submit" data-submit-guard>Enroll clinic and send invitation</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
