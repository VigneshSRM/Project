<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${pageTitle} + ' · IMS'">Patient</title>
</head>
<body>
<div layout:fragment="content">
    <div th:with="formHeading=${editing ? 'Edit patient' : 'New patient'},
                  formBadge=${editing ? 'Editing' : 'New record'}">
    <div th:replace="~{fragments/page-header :: header(
            ${formHeading},
            'Demographic and optional medical details. The clinic owns this master record.',
            null, null, ${formBadge}, 'info')}"></div>

    <div class="content-body">
        <form th:action="${editing ? '/clinic/patients/' + patientId + '/edit' : '/clinic/patients'}"
              th:object="${patientForm}" method="post" data-guard>
            <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            </div>
            <section class="card form-section">
                <div class="card-header"><h2 class="card-title">Identity</h2></div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="firstName">First name <span class="required">*</span></label>
                            <input class="form-input" id="firstName" th:field="*{firstName}" required maxlength="100">
                            <div class="form-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="lastName">Last name <span class="required">*</span></label>
                            <input class="form-input" id="lastName" th:field="*{lastName}" required maxlength="100">
                            <div class="form-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="dob">Date of birth <span class="required">*</span></label>
                            <input class="form-input" id="dob" type="date" th:field="*{dob}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="gender">Gender</label>
                            <select class="form-select" id="gender" th:field="*{gender}">
                                <option value="">Not specified</option>
                                <option th:each="option : ${genders}" th:value="${option}"
                                        th:text="${option}">FEMALE</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="mobile">Mobile</label>
                            <input class="form-input" id="mobile" th:field="*{mobile}" maxlength="30">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-input" id="email" type="email" th:field="*{email}" maxlength="254">
                            <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="card form-section mt-4">
                <div class="card-header"><h2 class="card-title">Address and emergency contact</h2></div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="addressLine1">Address line 1</label>
                            <input class="form-input" id="addressLine1" th:field="*{addressLine1}" maxlength="200">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="addressLine2">Address line 2</label>
                            <input class="form-input" id="addressLine2" th:field="*{addressLine2}" maxlength="200">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="city">City</label>
                            <input class="form-input" id="city" th:field="*{city}" maxlength="100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="district">District</label>
                            <input class="form-input" id="district" th:field="*{district}" maxlength="100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="state">State</label>
                            <input class="form-input" id="state" th:field="*{state}" maxlength="100">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="postalCode">Postal code</label>
                            <input class="form-input" id="postalCode" th:field="*{postalCode}" maxlength="20">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="emergencyName">Emergency contact</label>
                            <input class="form-input" id="emergencyName" th:field="*{emergencyName}" maxlength="200">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="emergencyPhone">Emergency phone</label>
                            <input class="form-input" id="emergencyPhone" th:field="*{emergencyPhone}" maxlength="30">
                        </div>
                    </div>
                </div>
            </section>

            <section class="card form-section mt-4">
                <div class="card-header"><h2 class="card-title">Medical summary</h2></div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="bloodGroup">Blood group</label>
                            <input class="form-input" id="bloodGroup" th:field="*{bloodGroup}" maxlength="10">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="allergies">Allergies</label>
                            <textarea class="form-input" id="allergies" th:field="*{allergies}" maxlength="1000"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="conditions">Existing conditions</label>
                            <textarea class="form-input" id="conditions" th:field="*{conditions}" maxlength="1000"></textarea>
                        </div>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <a class="btn btn-secondary" th:href="@{/clinic/patients}">Cancel</a>
                <button class="btn btn-primary" type="submit" data-submit-guard>
                    <span th:text="${editing ? 'Save changes' : 'Create patient'}">Save</span>
                </button>
            </div>
        </form>
    </div>
    </div>
</div>
</body>
</html>
