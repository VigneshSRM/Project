<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Reset password · IMS</title>
</head>
<body>
<div layout:fragment="auth-content">
    <h1 class="auth-title">Choose a new password</h1>
    <p class="auth-subtitle">This link can be used once and expires after 60 minutes.</p>

    <div class="alert alert-error" th:if="${invalidToken}">
        <span th:text="${resetError != null ? resetError : 'This password reset link is invalid, expired or already used.'}">
            This password reset link is invalid or has expired.
        </span>
    </div>
    <div class="alert alert-error" th:if="${resetError != null and invalidToken == null}" th:text="${resetError}"></div>

    <div th:if="${invalidToken == true}">
        <a class="btn btn-primary" th:href="@{/forgot-password}" style="width:100%">Request a new link</a>
    </div>

    <form th:if="${invalidToken != true}" th:action="@{/reset-password}" method="post" data-guard>
        <input type="hidden" name="token" th:value="${token}">
        <div class="form-group">
            <label class="form-label" for="new-password">New password</label>
            <input class="form-input" id="new-password" name="newPassword" type="password"
                   autocomplete="new-password" aria-describedby="reset-password-help" required>
            <div class="form-help" id="reset-password-help">
                At least 10 characters, including a letter and a number.
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm new password</label>
            <input class="form-input" id="confirm-password" name="confirmPassword" type="password"
                   autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Update password</button>
    </form>

    <div class="auth-footer">
        <span>Back to</span>
        <a th:href="@{/login}">Sign in</a>
    </div>
</div>
</body>
</html>
