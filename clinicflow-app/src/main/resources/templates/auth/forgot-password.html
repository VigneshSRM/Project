<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth}">
<head>
    <title>Forgot password · IMS</title>
</head>
<body>
<div layout:fragment="auth-content">
    <h1 class="auth-title">Forgot password</h1>
    <p class="auth-subtitle">We will email a single-use reset link if the account exists.</p>

    <div class="alert alert-info">
        For privacy, this page always gives the same response. It does not reveal whether an
        email address is registered.
    </div>

    <form th:action="@{/forgot-password}" method="post" data-guard>
        <div class="form-group">
            <label class="form-label" for="forgot-email">Email address</label>
            <input class="form-input" id="forgot-email" name="email" type="email"
                   autocomplete="email" placeholder="you@example.com" required>
            <div class="form-help">The reset link expires in 60 minutes and can be used once.</div>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Send reset link</button>
    </form>

    <div class="auth-footer">
        <span>Remembered it?</span>
        <a th:href="@{/login}">Back to sign in</a>
    </div>
</div>
</body>
</html>
