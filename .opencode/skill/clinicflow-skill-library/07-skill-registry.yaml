skills:
- id: clinicflow-build-orchestrator
  name: ClinicFlow Build Orchestrator
  category: orchestration
  type: CORE
  description: Master entry point for developing the Clinic, Pharmacy and Patient Management application
    (working name ClinicFlow) end to end with a corporate-ERP-grade UI/UX.
  triggers:
  - whenever the user asks to build, scaffold, continue, extend or review any part of this app, or says
    'develop the application' - it sequences the other ClinicFlow skills, enforces the UI/UX Definition
    of Done (consistent shell, smooth navigation, breadcrumbs on every screen) and stops at human approval
    gates
  inputs:
  - '- `01-application-understanding.md` and the open `REQUIRES-CONFIRMATION` list. - Tech stack: **Java
    + Microsoft SQL Server (confirmed)**. Fr'
  outputs:
  - '- A running, navigable application increment per wave. - A short handoff note per module: done, gated,
    assumptions.'
  dependencies:
  - clinicflow-product-spec
  dependents: []
  risk: MEDIUM
  security_level: MEDIUM
  human_approval: false
  status: DRAFT
  version: 1.1.0
